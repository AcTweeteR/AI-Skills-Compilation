<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">AI Skills Compilation</title>
  <desc id="description">An evidence-first catalog for AI skills, agents, MCPs, prompts, frameworks, and tools.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#18263f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="1070" cy="48" r="170" fill="#38bdf8" opacity="0.07"/>
  <circle cx="1120" cy="340" r="240" fill="#818cf8" opacity="0.08"/>
  <rect x="64" y="62" width="8" height="236" rx="4" fill="url(#accent)"/>
  <text x="108" y="132" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="55" font-weight="700">AI Skills Compilation</text>
  <text x="108" y="184" fill="#b9c5d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25">Discover. Evaluate. Compare. Decide with evidence.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">
    <rect x="108" y="226" width="140" height="42" rx="21" fill="#0f3650" stroke="#38bdf8"/>
    <text x="178" y="253" fill="#e0f2fe" text-anchor="middle">Evidence</text>
    <rect x="264" y="226" width="172" height="42" rx="21" fill="#242d5b" stroke="#818cf8"/>
    <text x="350" y="253" fill="#e0e7ff" text-anchor="middle">Compatibility</text>
    <rect x="452" y="226" width="112" height="42" rx="21" fill="#3f2635" stroke="#fb7185"/>
    <text x="508" y="253" fill="#ffe4e6" text-anchor="middle">Risk</text>
  </g>
</svg>
