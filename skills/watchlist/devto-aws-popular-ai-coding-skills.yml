id: devto-aws-popular-ai-coding-skills
name: The most popular AI coding skills right now
source: https://dev.to/aws/the-most-popular-ai-coding-skills-right-now-4183
status: watchlist
artifact_type: secondary-source
category: secondary-reference
summary: >
  AWS/DEV article explaining the current agent-skill trend and highlighting popular workflow and framework
  skills. Useful as a readable orientation piece and candidate-discovery source, but not as a primary registry
  source.

what_it_does:
  plain_language: >
    Explains what agent skills are, why they are becoming popular, and gives examples of heavily used workflow
    skills and framework-specific skills. It also gives practical safety advice: read the skill before installing
    it and treat it like a dependency.
  main_features:
    - Plain-language explanation of SKILL.md-style agent skills
    - Overview of popular workflow skills
    - Mentions Superpowers, Karpathy guidelines, Matt Pocock skills, GStack, GSD Core, Vue skills, and AWS Agent Toolkit
    - Includes installation snippets for some tools
    - Gives safety guidance around reading skills before use
  best_use_case: >
    Use as a quick orientation article for deciding which popular workflow skills might be worth reviewing from
    their original sources.

compatibility:
  chatgpt: limited
  openai_codex: limited
  claude: limited
  claude_code: limited
  perplexity: "yes"
  gemini: limited
  cursor: limited
  windsurf: limited
  other:
    - Kiro
    - Gemini CLI
compatibility_notes: >
  The article itself is compatible mainly as research/reference material. The mentioned skills target multiple
  agents, but each original project needs separate review before being listed as a real skill candidate.

useful_for:
  - beginner_orientation
  - popular_skill_discovery
  - workflow_skill_shortlisting
  - safety_reminder
  - finding_original_sources_to_review
not_recommended_for:
  - primary_registry_source
  - direct_installation
  - copying_install_commands_without_review
  - duplicate_import_of_individual_skills

risk_level: medium
risk_reasons:
  - Secondary article, not primary documentation.
  - Includes install commands and external links.
  - Mentions high-control workflow systems that can take over planning and implementation.
  - Popularity is not a safety signal.

install_allowed: false
execution_allowed: false
requires_sandbox: true
approved_for_project_integration: false
approved_scope: read_only_reference

data_access:
  local_files: "no"
  network: "yes"
  credentials: possible
  persistent_memory: possible
  shell_commands: possible
  git_hooks: unknown
  writes_files: possible
  modifies_code: possible

review:
  reviewed_at: "2026-07-03"
  reviewed_by: ChatGPT
  review_status: watchlist_secondary_source
  evidence_checked:
    - DEV article
    - Mentioned skill categories
    - Installation snippets
    - Safety guidance
  notes: >
    Keep as a readable watchlist source. It is more useful than the previously rejected Medium article because it
    explains how skills work and gives practical safety advice, but it still should not be used as a source of
    truth for installing anything.

safe_usage_boundary: >
  Read-only reference. If one mentioned skill looks useful, add the original repository as a separate candidate
  and review it directly.

next_action: >
  Consider individual reviews later for Superpowers, Matt Pocock skills, GStack, GSD Core, and AWS Agent Toolkit
  only if they match a concrete need.
