# Central registry for AI skills, agents, tools, prompts, workflows, and repositories.
#
# This file is a catalog only. It does not install, execute, clone, or authorize anything.
# Keep one compact entry per profile. Detailed evidence belongs in registry_file.

schema_version: 2
repository_policy: documentation_only
last_updated: "2026-07-30"

allowed_statuses:
  - candidate
  - watchlist
  - approved
  - rejected

allowed_risk_levels:
  - low
  - medium
  - high
  - critical

allowed_compatibility_values:
  - "yes"
  - limited
  - "no"
  - unknown

# This order is also the catalog order. Rejected entries are always placed last.
allowed_artifact_types:
  - executable-tool
  - individual-skill
  - curated-index
  - marketplace
  - secondary-source

ai_targets:
  - chatgpt
  - openai_codex
  - claude
  - claude_code
  - perplexity
  - gemini
  - cursor
  - windsurf

default_rules:
  install_allowed: false
  execution_allowed: false
  requires_human_review: true
  requires_sandbox_for_testing: true
  approved_for_project_integration: false

skills:
  - id: claude-mem
    name: Claude-Mem
    source: https://github.com/thedotmack/claude-mem
    registry_file: skills/candidates/claude-mem.yml
    status: candidate
    artifact_type: executable-tool
    category: agent-memory
    summary: >
      Persistent memory for coding agents; retained as a candidate because hooks, local services, and stored
      activity require an isolated security and privacy review.
    risk_level: critical

  - id: headroom
    name: Headroom
    source: https://github.com/headroomlabs-ai/headroom
    registry_file: skills/candidates/headroom.yml
    status: candidate
    artifact_type: executable-tool
    category: context-management
    summary: >
      Context-compression proxy and agent wrapper; retained as a candidate because it can intercept requests,
      persist content, handle authorization, and modify agent instruction files.
    risk_level: critical

  - id: voltagent-awesome-agent-skills-index
    name: Awesome Agent Skills
    source: https://github.com/VoltAgent/awesome-agent-skills
    registry_file: skills/accepted/voltagent-awesome-agent-skills-index.yml
    status: approved
    artifact_type: curated-index
    category: skill-discovery
    summary: >
      Multi-agent curated index approved only for read-only discovery; its large set of third-party entries is
      not transitively trusted.
    risk_level: high

  - id: awesome-codex-skills-index
    name: Awesome Codex Skills
    source: https://github.com/composio-community/awesome-codex-skills
    registry_file: skills/accepted/awesome-codex-skills-index.yml
    status: approved
    artifact_type: curated-index
    category: skill-discovery
    summary: >
      Codex-oriented curated index approved only for read-only discovery; every linked skill requires its own
      review before installation or execution.
    risk_level: high

  - id: awesomeskill-marketplace
    name: AwesomeSkill.ai
    source: https://awesomeskill.ai/
    registry_file: skills/watchlist/awesomeskill-marketplace.yml
    status: watchlist
    artifact_type: marketplace
    category: skill-discovery
    summary: >
      Marketplace retained for candidate discovery only; popularity and inclusion do not establish quality or
      safety.
    risk_level: medium

  - id: devto-aws-popular-ai-coding-skills
    name: The most popular AI coding skills right now
    source: https://dev.to/aws/the-most-popular-ai-coding-skills-right-now-4183
    registry_file: skills/watchlist/devto-aws-popular-ai-coding-skills.yml
    status: watchlist
    artifact_type: secondary-source
    category: secondary-reference
    summary: >
      Secondary orientation article retained for discovery; claims and installation snippets must be verified
      against primary sources.
    risk_level: medium

  - id: medium-9-must-have-codex-skills-2026
    name: 9 Must-Have Skills for Codex in 2026
    source: https://medium.com/@unicodeveloper/9-must-have-skills-for-codex-in-2026-b5124b375eec
    registry_file: skills/rejected/medium-9-must-have-codex-skills-2026.yml
    status: rejected
    artifact_type: secondary-source
    category: secondary-reference
    summary: >
      Secondary opinion article rejected as a primary catalog source because it overlaps curated indexes and
      mixes skills, services, plugins, and product features.
    risk_level: medium
