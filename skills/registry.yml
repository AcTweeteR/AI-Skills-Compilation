# Central registry for AI skills, agents, tools, prompts, workflows, and repositories.
#
# This file is a catalog only. It does not install, execute, clone, or authorize anything.

schema_version: 1
repository_policy: documentation_only
last_updated: "2026-07-04"

allowed_statuses:
  - candidate
  - watchlist
  - approved
  - rejected

allowed_risk_levels:
  - low
  - medium
  - high
  - critical

allowed_compatibility_values:
  - yes
  - limited
  - no
  - unknown

ai_targets:
  - chatgpt
  - openai_codex
  - claude
  - claude_code
  - perplexity
  - gemini
  - cursor
  - windsurf

# Default rule: a listed skill is not approved for installation, execution, or project integration.
default_rules:
  install_allowed: false
  execution_allowed: false
  requires_human_review: true
  requires_sandbox_for_testing: true
  approved_for_project_integration: false

skills:
  - id: claude-mem
    name: Claude-Mem
    source: https://github.com/thedotmack/claude-mem
    registry_file: skills/candidates/claude-mem.yml
    status: candidate
    category: persistent-memory
    summary: >
      Persistent context and memory system for coding agents. High utility for long projects, but direct use is
      blocked until sandbox review because it captures agent activity, uses hooks, stores local data, and runs a
      local worker service.
    compatibility:
      chatgpt: limited
      openai_codex: limited
      claude: limited
      claude_code: yes
      perplexity: no
      gemini: limited
      cursor: limited
      windsurf: limited
      other:
        - OpenClaw
        - OpenCode
        - GitHub Copilot
    risk_level: critical
    install_allowed: false
    execution_allowed: false
    requires_sandbox: true
    approved_for_project_integration: false
    next_action: Sandbox-only investigation before any real use.

  - id: headroom
    name: Headroom
    source: https://github.com/headroomlabs-ai/headroom
    registry_file: skills/candidates/headroom.yml
    status: candidate
    category: context-compression-proxy
    summary: >
      Local-first context compression layer for AI agents. Useful for reducing tokens and sharing compressed
      context across agents, but direct use is blocked until sandbox review because it wraps agents, runs as a
      proxy/MCP server, persists retrievable originals, and may handle OAuth/token routing.
    compatibility:
      chatgpt: limited
      openai_codex: yes
      claude: limited
      claude_code: yes
      perplexity: no
      gemini: yes
      cursor: limited
      windsurf: unknown
      other:
        - Aider
        - GitHub Copilot CLI
        - OpenClaw
        - OpenCode
        - Cline
        - Continue
        - Goose
        - OpenHands
        - Mistral Vibe
        - Cortex Code
    risk_level: critical
    install_allowed: false
    execution_allowed: false
    requires_sandbox: true
    approved_for_project_integration: false
    next_action: Sandbox-only investigation before any real use.

